<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Sitol Chaya</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #faf8f3;
        color: #0c1414;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0c1414; color: #e7f0ef; }
        .card { background: rgba(255, 255, 255, 0.04); border-color: rgba(255,255,255,0.08); }
      }
      .card {
        max-width: 22rem;
        padding: 32px 28px;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 10px 40px -12px rgba(20, 184, 166, 0.25);
      }
      .logo {
        width: 64px; height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        display: grid; place-items: center;
        font-size: 32px;
        background: linear-gradient(135deg, #14b8a6, #22c55e);
      }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; opacity: 0.7; font-size: 0.925rem; line-height: 1.5; }
      button {
        appearance: none; border: 0; cursor: pointer;
        padding: 12px 20px; border-radius: 12px;
        font-size: 0.925rem; font-weight: 600; color: #fff;
        background: #14b8a6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🍃</div>
      <h1>You're offline</h1>
      <p>Sitol Chaya can't reach the network right now. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
